apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')

    // IthaGram: motor de plugins (portado de exteraGram/Nagram)
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.3'
    implementation 'org.mvel:mvel2:2.5.2.Final'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz", "es"]
    }

    // IthaGram: firma con tu propia clave (local.properties); si no esta, usa la del repo
    def ksProps = new Properties()
    def ksFile = rootProject.file('local.properties')
    if (ksFile.exists()) {
        ksFile.withInputStream { ksProps.load(it) }
    }
    def ksPath = ksProps.getProperty('KEYSTORE_FILE')
    def ksStorePass = ksProps.getProperty('KEYSTORE_PASS') ?: RELEASE_STORE_PASSWORD
    def ksAlias = ksProps.getProperty('ALIAS_NAME') ?: RELEASE_KEY_ALIAS
    def ksKeyPass = ksProps.getProperty('ALIAS_PASS') ?: RELEASE_KEY_PASSWORD

    signingConfigs {
        debug {
            storeFile file(ksPath ?: "../TMessagesProj/config/release.keystore")
            storePassword ksStorePass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }

        release {
            storeFile file(ksPath ?: "../TMessagesProj/config/release.keystore")
            storePassword ksStorePass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "IthaGram-${APP_VERSION_NAME}.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49', 'twidget'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'

// IthaGram: soporte de plugins (Python via Chaquopy)
chaquopy {
    defaultConfig {
        version = "3.11"
        // librerias de Python que usan algunos plugins (se descargan al compilar)
        pip {
            install "requests"
            install "Pillow"
        }
        pyc {
            src = false
            pip = false
            stdlib = false
        }
    }
}

android {
    defaultConfig {
        proguardFiles 'proguard-itha-plugins.pro'
        proguardFiles 'proguard-itha-engine.pro'
    }
}
